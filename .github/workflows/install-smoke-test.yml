name: Install Smoke Test

# Builds the ISO and actually installs from it in QEMU, then verifies the
# resulting system. The release workflow only proves the ISO *builds*; every
# installation defect so far shipped through a green build, so this is the job
# that has to be green before cutting a release.

on:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'install/**'
      - 'bin/**'
      - 'default/**'
      - '.github/workflows/install-smoke-test.yml'
  pull_request:
    paths:
      - 'iso/**'
      - 'install/**'
      - 'bin/**'
      - 'default/**'
      - '.github/workflows/install-smoke-test.yml'
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Also boot the installed system and capture desktop screenshots
        type: boolean
        default: false
      keep_image:
        description: 'Upload the installed disk image as an artifact'
        type: boolean
        default: false

# A full install takes tens of minutes. Without this, a run of pushes queues a
# run each and they all grind through the same work; only the newest matters.
concurrency:
  group: install-smoke-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-test:
    name: Install in QEMU and verify
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install QEMU and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf dosfstools mtools imagemagick

      - name: Check for KVM acceleration
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available - install runs at near-native speed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KVM; falling back to TCG emulation, which is much slower."
          fi

      - name: Locate OVMF firmware
        id: ovmf
        run: |
          # Package layout differs between Ubuntu releases.
          for c in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            [ -f "$c" ] && { echo "code=$c" >> "$GITHUB_OUTPUT"; break; }
          done
          for v in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do
            [ -f "$v" ] && { cp "$v" ./OVMF_VARS.fd; break; }
          done
          ls -l ./OVMF_VARS.fd
          cat "$GITHUB_OUTPUT"

      - name: Build ISO
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm archlinux-keyring &&
              pacman -S --noconfirm --needed archiso git rsync base-devel &&
              chmod +x iso/builder/build-iso.sh &&
              ./iso/builder/build-iso.sh /workspace/out
            "
          sudo chown -R "$USER:$USER" out
          ls -lh out/

      - name: Create unattended answers disk
        run: |
          # The answers travel on a separate labeled disk so the ISO under test
          # stays byte for byte identical to the ISO that ships.
          mkdir -p answers
          {
            echo 'GNOMARCHY_DISK=/dev/vda'
            echo 'GNOMARCHY_FULLNAME="CI Test User"'
            echo 'GNOMARCHY_USERNAME=citest'
            echo 'GNOMARCHY_PASSWORD=ci-test-password-123'
            echo 'GNOMARCHY_ENCRYPT=n'
          } > answers/gnomarchy-unattended.conf
          cat answers/gnomarchy-unattended.conf

          truncate -s 8M answers.img
          mkfs.vfat -n GNOMARCHY answers.img
          mcopy -i answers.img answers/gnomarchy-unattended.conf ::/
          mdir -i answers.img ::/

      - name: Run the installer in QEMU
        run: |
          qemu-img create -f qcow2 disk.qcow2 30G

          ACCEL="-accel tcg"
          MEM=4096
          if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
            ACCEL="-accel kvm -cpu host"
            MEM=8192
          fi

          set +e
          sudo timeout 100m qemu-system-x86_64 \
            $ACCEL -smp 4 -m $MEM \
            -drive if=pflash,format=raw,readonly=on,file=${{ steps.ovmf.outputs.code }} \
            -drive if=pflash,format=raw,file=./OVMF_VARS.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -drive file=answers.img,if=virtio,format=raw \
            -cdrom out/*.iso \
            -boot d \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:installer-serial.log \
            -no-reboot
          echo "qemu exit: $?"
          set -e

          sudo chown "$USER:$USER" disk.qcow2 installer-serial.log 2>/dev/null || true
          echo "--- installer serial tail ---"
          tail -80 installer-serial.log 2>/dev/null || echo "(no serial output captured)"

      - name: Mount the installed system
        id: mount
        run: |
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          sudo partprobe /dev/nbd0 || true
          lsblk /dev/nbd0

          sudo mkdir -p /mnt/gnomarchy
          # The installer splits the filesystem into subvolumes. Mounting only
          # @ leaves /home and /var/log as empty directories, which silently
          # turns every check against them into a false failure.
          if sudo mount -o subvol=@,ro /dev/nbd0p3 /mnt/gnomarchy; then
            sudo mount -o subvol=@home,ro /dev/nbd0p3 /mnt/gnomarchy/home
            sudo mount -o subvol=@var_log,ro /dev/nbd0p3 /mnt/gnomarchy/var/log
            sudo mount -o ro /dev/nbd0p2 /mnt/gnomarchy/boot
            echo "mounted=true" >> "$GITHUB_OUTPUT"
            echo "--- root ---";     sudo ls /mnt/gnomarchy
            echo "--- home ---";     sudo ls /mnt/gnomarchy/home
            echo "--- var/log ---";  sudo ls /mnt/gnomarchy/var/log
          else
            echo "mounted=false" >> "$GITHUB_OUTPUT"
            echo "::error::Could not mount the installed root - the install never completed."
            exit 1
          fi

      - name: Show where the installer got to
        if: always() && steps.mount.outputs.mounted == 'true'
        run: |
          LOG=/mnt/gnomarchy/var/log/gnomarchy-install.log
          if sudo test -f "$LOG"; then
            echo "Last stage completed:"
            sudo grep 'STAGE OK' "$LOG" | tail -1 || echo "  (none)"
            echo "Stopped in:"
            sudo grep 'STAGE START' "$LOG" | tail -1 || echo "  (none)"
            echo
            echo "--- last 60 lines of the install log ---"
            sudo tail -60 "$LOG"
          else
            echo "::warning::No install log on the target; the chroot stage may never have started."
          fi

      - name: Verify installed system (offline)
        env:
          GNOMARCHY_TEST_USER: citest
        run: sudo -E bash iso/tests/verify-install.sh /mnt/gnomarchy

      - name: Prepare the image for the session test
        if: always() && steps.mount.outputs.mounted == 'true'
        run: |
          sudo umount -R /mnt/gnomarchy
          sudo mount -o subvol=@ /dev/nbd0p3 /mnt/gnomarchy
          sudo mount -o subvol=@home /dev/nbd0p3 /mnt/gnomarchy/home
          # /boot is the EFI partition, not part of the @ subvolume; limine.conf
          # lives there and is invisible without this.
          sudo mount /dev/nbd0p2 /mnt/gnomarchy/boot

          # Autologin, so a real graphical session starts and the first-run
          # autostart entry fires. That is the only path by which the dconf
          # state under test ever gets written.
          sudo mkdir -p /mnt/gnomarchy/etc/gdm
          printf '%s\n' \
            '[daemon]' \
            'AutomaticLoginEnable=True' \
            'AutomaticLogin=citest' \
            'WaylandEnable=True' \
            | sudo tee /mnt/gnomarchy/etc/gdm/custom.conf > /dev/null

          sudo install -m 755 iso/tests/verify-session.sh \
            /mnt/gnomarchy/usr/local/bin/gnomarchy-verify-session

          # Ordered last by filename so it runs after gnomarchy-first-run.
          sudo mkdir -p /mnt/gnomarchy/home/citest/.config/autostart
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Gnomarchy CI Session Verification' \
            'Exec=/usr/local/bin/gnomarchy-verify-session' \
            'Terminal=false' \
            'X-GNOME-Autostart-enabled=true' \
            'NoDisplay=true' \
            | sudo tee /mnt/gnomarchy/home/citest/.config/autostart/zz-verify.desktop > /dev/null
          sudo chown -R 1000:1000 /mnt/gnomarchy/home/citest/.config

          # Let the verification script end the run.
          echo 'citest ALL=(ALL) NOPASSWD: /usr/bin/systemctl poweroff' \
            | sudo tee /mnt/gnomarchy/etc/sudoers.d/99-ci-verify > /dev/null
          sudo chmod 440 /mnt/gnomarchy/etc/sudoers.d/99-ci-verify

          # Put the kernel console on the serial port for this test image
          # only. Without it the serial log captures nothing past the EFI
          # menu, and a boot that fails is completely opaque.
          if sudo test -f /mnt/gnomarchy/boot/limine.conf; then
            sudo sed -i 's/quiet splash/console=tty0 console=ttyS0,115200 systemd.log_level=info/' \
              /mnt/gnomarchy/boot/limine.conf
            echo "--- limine.conf ---"
            sudo cat /mnt/gnomarchy/boot/limine.conf
          else
            # A warning here only becomes an annotation, which is easy to miss;
            # without the serial console the session test cannot be diagnosed
            # at all, so fail rather than run blind.
            echo "::error::No limine.conf at /mnt/gnomarchy/boot - is the EFI partition mounted?"
            sudo ls -la /mnt/gnomarchy/boot || true
            exit 1
          fi

          # Persist the journal so a failed boot can be read offline.
          sudo mkdir -p /mnt/gnomarchy/var/log/journal

          sudo umount -R /mnt/gnomarchy
          sudo qemu-nbd --disconnect /dev/nbd0
          sleep 3

      - name: Boot the installed system and verify the session
        if: always() && steps.mount.outputs.mounted == 'true'
        run: |
          ACCEL="-accel tcg"
          MEM=4096
          if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
            ACCEL="-accel kvm -cpu host"
            MEM=8192
          fi

          set +e
          sudo timeout 15m qemu-system-x86_64 \
            $ACCEL -smp 4 -m $MEM \
            -drive if=pflash,format=raw,readonly=on,file=${{ steps.ovmf.outputs.code }} \
            -drive if=pflash,format=raw,file=./OVMF_VARS.fd \
            -drive file=disk.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:session-serial.log \
            -no-reboot
          echo "qemu exit: $?"
          set -e
          sudo chown "$USER:$USER" disk.qcow2 session-serial.log 2>/dev/null || true

      - name: Read session verification results
        if: always() && steps.mount.outputs.mounted == 'true'
        run: |
          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          sudo mount -o subvol=@,ro /dev/nbd0p3 /mnt/gnomarchy
          sudo mount -o subvol=@home,ro /dev/nbd0p3 /mnt/gnomarchy/home
          sudo mount -o subvol=@var_log,ro /dev/nbd0p3 /mnt/gnomarchy/var/log

          # The verify script logged nothing at all last time, so establish
          # whether it was ever installed and scheduled before interpreting
          # anything else.
          echo "--- autostart entries ---"
          sudo ls -la /mnt/gnomarchy/home/citest/.config/autostart/ 2>&1 || echo "(no autostart dir)"
          echo "--- verify script on the image ---"
          sudo ls -la /mnt/gnomarchy/usr/local/bin/gnomarchy-verify-session 2>&1 || echo "(not installed)"
          echo "--- first-run stamp ---"
          sudo ls -la /mnt/gnomarchy/home/citest/.local/state/gnomarchy/ 2>&1 || echo "(no state dir)"
          echo "--- gnome-session autostart decisions ---"
          if sudo test -d /mnt/gnomarchy/var/log/journal; then
            sudo journalctl -D /mnt/gnomarchy/var/log/journal --no-pager 2>/dev/null |
              grep -iE "zz-verify|gnomarchy-verify|first-run|autostart" | tail -20 ||
              echo "(nothing about autostart in the journal)"
          fi

          echo "--- first-run trace ---"
          if sudo test -d /mnt/gnomarchy/var/log/journal; then
            sudo journalctl -D /mnt/gnomarchy/var/log/journal --no-pager               -t gnomarchy-first-run 2>/dev/null || echo "(no trace recorded)"
          fi

          echo "--- verification trace ---"
          if sudo test -d /mnt/gnomarchy/var/log/journal; then
            sudo journalctl -D /mnt/gnomarchy/var/log/journal --no-pager               -t gnomarchy-verify 2>/dev/null || echo "(no trace recorded)"
          fi

          echo "--- journal from the boot attempt ---"
          if sudo test -d /mnt/gnomarchy/var/log/journal; then
            sudo journalctl -D /mnt/gnomarchy/var/log/journal --no-pager \
              -p warning 2>/dev/null | tail -40 || echo "(journal unreadable)"
          else
            echo "(no persistent journal)"
          fi

          REPORT=/mnt/gnomarchy/var/tmp/gnomarchy-session-verify.txt
          if sudo test -f "$REPORT"; then
            echo "=== session verification report ==="
            sudo cat "$REPORT"
            if sudo grep -q "RESULT: SUCCESS" "$REPORT"; then
              echo "Session verification passed."
            else
              echo "::error::Session verification failed."
              exit 1
            fi
          else
            echo "::error::No session report - the desktop never reached the verification step."
            echo "--- session serial tail ---"
            tail -100 session-serial.log 2>/dev/null || true
            exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts
          # Always leave something behind, so an early failure still uploads a
          # usable artifact instead of an empty directory.
          {
            echo "run: ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "kvm: ${{ steps.kvm.outputs.available }}"
            echo "root mounted: ${{ steps.mount.outputs.mounted }}"
            echo "---"
            ls -lh out/ 2>/dev/null || echo "(no ISO built)"
          } > artifacts/summary.txt
          cp installer-serial.log artifacts/ 2>/dev/null || true
          cp session-serial.log artifacts/ 2>/dev/null || true
          sudo cp /mnt/gnomarchy/var/log/gnomarchy-install.log artifacts/ 2>/dev/null || true
          sudo cp /mnt/gnomarchy/var/tmp/gnomarchy-session-verify.txt artifacts/ 2>/dev/null || true
          sudo chown -R "$USER:$USER" artifacts 2>/dev/null || true
          ls -la artifacts/ || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-test-logs
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload installed image
        if: always() && inputs.keep_image
        uses: actions/upload-artifact@v4
        with:
          name: installed-disk-image
          path: disk.qcow2
          retention-days: 3

      # --- Screenshots -------------------------------------------------
      # Off by default and dispatch-only: these frames are for the README and
      # for posting, not for proving the install works, and they cost a boot of
      # their own. Nothing here runs on push or pull_request.
      - name: Prepare the image for screenshot capture
        if: always() && inputs.capture_screenshots
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "The install never mounted, so there is nothing to photograph."
            exit 0
          fi

          sudo umount -R /mnt/gnomarchy 2>/dev/null || true
          sudo mount -o subvol=@ /dev/nbd0p3 /mnt/gnomarchy
          sudo mount -o subvol=@home /dev/nbd0p3 /mnt/gnomarchy/home

          sudo install -m 755 iso/tests/capture-screenshots.sh \
            /mnt/gnomarchy/usr/local/bin/gnomarchy-capture-screenshots

          # Verification has already run, and its autostart entry powers the
          # machine off - which would end the capture session before it starts.
          sudo rm -f /mnt/gnomarchy/home/citest/.config/autostart/zz-verify.desktop
          printf "%s\n" \
            "[Desktop Entry]" \
            "Type=Application" \
            "Name=Gnomarchy Screenshot Capture" \
            "Exec=/usr/local/bin/gnomarchy-capture-screenshots" \
            "Terminal=false" \
            "X-GNOME-Autostart-enabled=true" \
            "NoDisplay=true" \
            | sudo tee /mnt/gnomarchy/home/citest/.config/autostart/zz-capture.desktop > /dev/null

          # The capture logs out once to reload the shell for tiling and picks
          # its phase back up from this file, so it must start absent.
          sudo rm -f /mnt/gnomarchy/home/citest/.local/state/gnomarchy/capture-phase
          sudo chown -R 1000:1000 /mnt/gnomarchy/home/citest/.config

          echo "--- autostart entries for the capture boot ---"
          sudo ls -la /mnt/gnomarchy/home/citest/.config/autostart/

          sudo umount -R /mnt/gnomarchy
          sudo qemu-nbd --disconnect /dev/nbd0
          sleep 3

      # Two boots, not one with a logout in the middle. Dynamic tiling only
      # takes effect once the shell reloads, and under Wayland that needs a new
      # session; logging out was tried and kills the capture script with it.
      # The guest powers itself off at the end of each phase.
      - name: Capture the desktop, boot 1
        if: always() && inputs.capture_screenshots
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
          KVM: ${{ steps.kvm.outputs.available }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "Skipped: nothing installed to photograph."
            exit 0
          fi
          if [ "$KVM" = "true" ]; then
            export ACCEL="-accel kvm -cpu host"
            export MEM=8192
          fi
          bash iso/tests/capture-host.sh disk.qcow2 ${{ steps.ovmf.outputs.code }} ./OVMF_VARS.fd frames phase1

      - name: Capture the desktop, boot 2
        if: always() && inputs.capture_screenshots
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
          KVM: ${{ steps.kvm.outputs.available }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "Skipped: nothing installed to photograph."
            exit 0
          fi
          if [ "$KVM" = "true" ]; then
            export ACCEL="-accel kvm -cpu host"
            export MEM=8192
          fi
          bash iso/tests/capture-host.sh disk.qcow2 ${{ steps.ovmf.outputs.code }} ./OVMF_VARS.fd frames phase2

      - name: Convert and collect the frames
        if: always() && inputs.capture_screenshots
        env:
          MOUNTED: ${{ steps.mount.outputs.mounted }}
        run: |
          if [ "$MOUNTED" != "true" ]; then
            echo "Skipped: nothing installed to photograph."
            exit 0
          fi

          sudo qemu-nbd --connect=/dev/nbd0 disk.qcow2
          sleep 5
          sudo mkdir -p /mnt/gnomarchy
          sudo mount -o subvol=@,ro /dev/nbd0p3 /mnt/gnomarchy

          mkdir -p screenshots
          sudo cp /mnt/gnomarchy/var/tmp/gnomarchy-capture.txt screenshots/ 2>/dev/null || true
          sudo chown -R "$USER:$USER" screenshots

          # The transcript says when each arrangement was on screen, which is
          # what pairs a frame with the thing it is a picture of.
          echo "=== capture transcript ==="
          cat screenshots/gnomarchy-capture.txt 2>/dev/null || echo "(no transcript - the capture script never ran)"

          # A framebuffer dump is about 6 MB a frame; the same pixels as PNG are
          # a fraction of that, and PNG is what anyone downloading this wants.
          CONVERT=convert
          command -v magick >/dev/null 2>&1 && CONVERT=magick
          shopt -s nullglob
          for ppm in frames/*.ppm; do
            png="screenshots/$(basename "${ppm%.ppm}").png"
            "$CONVERT" "$ppm" "$png" || echo "could not convert $ppm"
          done
          for index in frames/*-index.txt; do
            cp "$index" screenshots/
          done

          echo
          echo "=== frames ==="
          ls -la screenshots/

          # A run that photographs nothing has to be visibly red, or it reads
          # as a success that merely happened to produce no artifact.
          if ! ls screenshots/*.png >/dev/null 2>&1; then
            echo "--- serial tails ---"
            tail -60 capture-phase1-serial.log 2>/dev/null || true
            tail -60 capture-phase2-serial.log 2>/dev/null || true
            echo "::error::No screenshots were captured."
            exit 1
          fi

      - name: Upload screenshots
        if: always() && inputs.capture_screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gnomarchy-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          sudo umount -R /mnt/gnomarchy 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
