<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gnomarchyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7aa2f7" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#1f2335" stroke="#414868" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Stylized GNOME Footprint fused with Arch Chevron -->
  <!-- Heel / Palm base -->
  <path d="M 46 88 C 42 74, 52 64, 62 60 C 72 56, 86 64, 84 78 C 82 92, 68 96, 56 94 C 50 93, 47 91, 46 88 Z" fill="url(#gnomarchyGrad)" />
  
  <!-- Big Toe / Apex (Arch Inspired Peak) -->
  <path d="M 68 24 C 74 24, 82 32, 80 44 C 78 52, 70 54, 64 52 C 58 50, 56 42, 58 34 C 60 28, 64 24, 68 24 Z" fill="url(#gnomarchyGrad)" />
  
  <!-- Toe 2 -->
  <circle cx="50" cy="38" r="7" fill="url(#gnomarchyGrad)" />
  
  <!-- Toe 3 -->
  <circle cx="40" cy="50" r="6" fill="url(#gnomarchyGrad)" />
  
  <!-- Toe 4 -->
  <circle cx="36" cy="65" r="5" fill="url(#gnomarchyGrad)" />

  <!-- Arch Chevron subtle overlay lines -->
  <path d="M 64 24 L 92 84 L 80 84 L 72 68 L 56 68 L 48 84 L 36 84 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
</svg>
